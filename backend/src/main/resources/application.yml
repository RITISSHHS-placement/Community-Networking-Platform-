server:
  port: ${PORT:8081}

spring:
  application:
    name: community-networking-events-platform

  datasource:
    url: ${DB_URL:jdbc:h2:mem:cned;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # Minimum 256-bit secret. ALWAYS override via environment variable in production.
    secret: ${JWT_SECRET:this-is-a-development-only-secret-change-me-please-32b}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.examly.springapp: DEBUG
